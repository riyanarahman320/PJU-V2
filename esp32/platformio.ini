; Konfigurasi PlatformIO untuk firmware ASEP-JAGA (ESP32-S3).
;
; BOARD PERLU DISESUAIKAN SEBELUM UPLOAD KE HARDWARE NYATA.
; Board di bawah adalah konfigurasi ESP32-S3 generik (esp32-s3-devkitc-1).
; Bila unit yang dipakai berbeda (mis. ESP32-S3-DevKitM-1, S3-Zero, atau
; modul dengan PSRAM octal), sesuaikan `board` di sini dan pin di
; include/config.h. Board yang salah membuat ukuran flash/PSRAM tidak cocok
; dan upload dapat gagal.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
; Exception decoder membantu membaca stack trace bila firmware crash.
monitor_filters = esp32_exception_decoder, time

; Dependency dijaga seminimal mungkin.
;   ArduinoJson -> menyusun & membaca JSON sesuai schema backend.
; WiFi.h dan HTTPClient.h sudah termasuk framework Arduino ESP32, jadi
; tidak perlu dicantumkan sebagai lib_deps.
;
; TIDAK ADA library mikrofon di sini. Hardware mikrofon belum ditentukan, dan
; menambahkan driver untuk perangkat yang belum dipilih hanya menjadi kode
; mati. Lihat readAudioFeatures() di src/main.cpp.
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0

build_flags =
    -DCORE_DEBUG_LEVEL=1