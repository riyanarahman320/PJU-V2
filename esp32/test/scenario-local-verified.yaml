};

static TestButton testButtons[] = {
    {PIN_BTN_AUDIO_NORMAL, HIGH, 0, false},
    {PIN_BTN_AUDIO_DISTRESS, HIGH, 0, false},
    {PIN_BTN_POLL_SERVER, HIGH, 0, false},
    {PIN_BTN_RESET, HIGH, 0, false},
};

static const size_t TEST_BUTTON_COUNT =
    sizeof(testButtons) / sizeof(testButtons[0]);

/* Penjadwalan non-blocking */
static unsigned long lastHeartbeatMs = 0;
static unsigned long lastCommandPollMs = 0;
static unsigned long lastWifiRetryMs = 0;
static unsigned long lastRegisterTryMs = 0;
static unsigned long lastEventRetryMs = 0;
static unsigned long lastStrobeToggleMs = 0;
static unsigned long lastSirenToggleMs = 0;
static bool strobeOn = false;
static bool sirenOn = false;

/* Retry pengiriman emergency.
 *
 * IDEMPOTENCY
 * -----------
 * currentEventId adalah IDEMPOTENCY KEY: satu kejadian SOS mendapat satu
 * nilai, dan nilai itu dipakai kembali pada SETIAP percobaan pengiriman.
 *
 * Ini menutup lubang yang tidak dapat ditutup firmware sendiri: bila POST
 * sampai ke server dan incident berhasil dibuat, tetapi responsnya hilang
 * karena timeout, perangkat tidak dapat membedakan keadaan itu dari "request
 * tidak pernah sampai". Perangkat harus mencoba lagi -- diam saja berarti
 * kejadian nyata tidak pernah dilaporkan. Dengan event_id yang sama, server
 * mengenali percobaan kedua sebagai kejadian yang sama dan mengembalikan
 * incident yang sudah ada, bukan membuat incident kedua.
 *
 * MENGAPA ADA bootId, BUKAN millis() SAJA
 * ---------------------------------------
 * millis() kembali ke 0 setiap kali perangkat reboot. Bila event_id hanya
 * berisi millis(), kejadian pertama setelah reboot dapat menghasilkan nilai
 * yang sama dengan kejadian lama yang masih tersimpan di server. Akibatnya
 * BUKAN incident ganda, melainkan yang jauh lebih berbahaya: emergency nyata
 * dianggap duplicate lalu diabaikan. bootId acak membuat setiap sesi boot
 * memiliki ruang nilai sendiri.
 *
 * eventCounter dipakai, bukan millis(), supaya nilainya tidak pernah
 * berulang walaupun perangkat menyala sangat lama (millis() melimpah
 * kembali ke 0 setelah sekitar 49 hari). */
static bool eventPending = false;
static uint32_t bootId = 0;
static unsigned long eventCounter = 0;
static String currentEventId = "";
static String activeIncidentId = "";

/* =====================================================================
 * ABSTRAKSI HARDWARE
 * ===================================================================== */

static inline void writeActuator(uint8_t pin, bool on) {
#if ACTUATOR_ACTIVE_HIGH
  digitalWrite(pin, on ? HIGH : LOW);
#else
  digitalWrite(pin, on ? LOW : HIGH);
#endif
}

static void setStrobe(bool on) {
  strobeOn = on;
  writeActuator(PIN_STROBE, on);
}

static void setSiren(bool on) {
  sirenOn = on;
  writeActuator(PIN_SIREN, on);
}

static void setSpeaker(bool on) { writeActuator(PIN_SPEAKER, on); }

