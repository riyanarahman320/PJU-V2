/* =====================================================================
 * STATE
 * ===================================================================== */

enum DeviceState {
  STATE_BOOT,
  STATE_READY,
  STATE_LOCAL_EMERGENCY, /* strobe aktif, menunggu keputusan server   */
  STATE_SERVER_CONFIRMED /* strobe + sirene + speaker aktif           */
};

static DeviceState deviceState = STATE_BOOT;

/* Fail-safe lokal: sekali true, hanya boleh dimatikan oleh CLEAR_EMERGENCY
 * dari server atau reset manual. TIDAK boleh dimatikan karena HTTP gagal. */
static bool localEmergencyActive = false;
static bool serverConfirmed = false;

static bool wifiConnected = false;
static bool deviceRegistered = false;

/* Fitur audio ringkas. Nama field mengikuti AUDIO_FEATURE_KEYS di
 * backend/schemas.py; tidak ada format yang dikarang di sini. */
struct AudioFeatures {
  float energy;
  float peak;
  float zeroCrossingRate;
  float dominantFrequency;
  float durationMs;
  bool valid; /* false bila mikrofon belum terpasang */
};

static AudioFeatures lastFeatures = {0, 0, 0, 0, 0, false};

/* Nilai yang dipakai verifikasi lokal.
 * PLACEHOLDER: diisi lewat Serial ('A 0.90'), bukan hasil inferensi. */
static float localAudioConfidence = 0.0f;
static String localAudioClass = AUDIO_CLASS_NORMAL;

/* Tombol SOS */
static bool sosPressed = false;
static bool sosLatched = false; /* menandai SOS pada kejadian berjalan  */
static int lastButtonReading = HIGH;
static unsigned long lastButtonChangeMs = 0;

/* Tombol pengujian - HANYA UNTUK SIMULASI.
 *
 * Keempat tombol ini menggantikan pengetikan Serial supaya demo Wokwi dapat
 * dijalankan dengan klik saja. Tombol ini TIDAK ada di perangkat sungguhan;
