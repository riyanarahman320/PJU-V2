/* =====================================================================
 * ASEP-JAGA - Firmware ESP32-S3
 * =====================================================================
 *
 * Alur:
 *   BOOT -> WiFi -> REGISTER -> HEARTBEAT
 *        -> SOS + MIC -> LOCAL VERIFICATION
 *        -> STROBE (fail-safe lokal, tanpa menunggu server)
 *        -> POST /api/emergency/evaluate
 *        -> POLL /api/device/<id>/command
 *        -> SIREN + SPEAKER (hanya bila server CONFIRMED)
 *        -> RESET -> READY
 *
 * DUA ATURAN YANG TIDAK BOLEH DILANGGAR
 * -------------------------------------
 * 1. SOS tidak pernah melewati verifikasi audio. Tidak ada cabang di
 *    localAudioVerified() yang mengembalikan true hanya karena tombol
 *    ditekan. Tombol yang tertekan tidak sengaja tidak boleh membangunkan
 *    sirene.
 * 2. Sirene hanya menyala setelah server mengirim EMERGENCY_CONFIRMED.
 *    Verifikasi lokal hanya menyalakan strobe.
 *
 * YANG BELUM NYATA DI FIRMWARE INI
 * --------------------------------
 * - Mikrofon: readAudioFeatures() adalah PLACEHOLDER. Tidak ada inferensi
 *   di perangkat, tidak ada TinyML, tidak ada model edge. Nilai keyakinan
 *   audio diisi lewat Serial untuk pengujian arsitektur.
 * - Speaker: playVoiceMessage() hanya mencetak ke Serial bila hardware
 * Keduanya ditandai jelas di kode dan tidak diklaim sebagai AI edge.
 */

